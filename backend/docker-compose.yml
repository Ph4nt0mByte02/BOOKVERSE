version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bookverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookverse_db
      POSTGRES_USER: bookverse_admin
      POSTGRES_PASSWORD: bookverse_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookverse_admin -d bookverse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
